services:
  db:
    image: postgres:16
    command: ["-c", "config_file=/etc/postgresql/postgresql.conf"]
    shm_size: 4g
    environment:
      POSTGRES_DB: events_db
      POSTGRES_USER: events_user
      POSTGRES_PASSWORD: events_pass
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/events/var/lib/postgresql/data/pgdata
      - ./postgresql/postgresql.conf:/etc/postgresql/postgresql.conf
    tmpfs:
      - /events/var/lib/postgresql/data/pgdata/pg_stat_tmp
      - /events/var/lib/postgresql/data/pgdata/pg_wal
    cpus: "2"
    mem_limit: "12g"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    sysctls:
      net.core.somaxconn: "4096"
      net.ipv4.tcp_tw_reuse: "1"
    networks:
      - backend
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/events_db
      SPRING_DATASOURCE_USERNAME: events_user
      SPRING_DATASOURCE_PASSWORD: events_pass
    depends_on:
      db:
        condition: service_healthy
    cpus: "2"
    mem_limit: "10g"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    sysctls:
      net.core.somaxconn: "4096"
      net.ipv4.tcp_tw_reuse: "1"
    networks:
      - backend
  prometheus:
    image: prom/prometheus:v2.44.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - backend
  grafana:
    image: grafana/grafana:9.5.2
    container_name: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - backend
volumes:
  postgres-data:
networks:
  backend:
    driver: bridge
