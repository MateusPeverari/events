version: '3.8'
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: events_db
      POSTGRES_USER: events_user
      POSTGRES_PASSWORD: events_pass
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC
    command:
      - postgres
      - -c
      - shared_buffers=3GB
      - -c
      - effective_cache_size=8GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_connections=200
      - -c
      - wal_buffers=64MB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=8GB
      - -c
      - autovacuum_max_workers=6
      - -c
      - autovacuum_naptime=30s
      - -c
      - autovacuum_vacuum_cost_limit=2000
      - -c
      - temp_buffers=16MB
      - -c
      - effective_io_concurrency=200
      - -c
      - random_page_cost=1.1
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs:
      - /var/lib/postgresql/data/pgdata/pg_stat_tmp
      - /var/lib/postgresql/data/pgdata/pg_tmp:size=2048m
    shm_size: '2gb'
    mem_limit: 12g
    mem_reservation: 8g
    cpus: 2.0
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events_user -d events_db"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - backend
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/events_db
      SPRING_DATASOURCE_USERNAME: events_user
      SPRING_DATASOURCE_PASSWORD: events_pass
      TZ: UTC
      JAVA_OPTS: "-Xms8g -Xmx8g -Xss512k -XX:+UseG1GC -XX:G1HeapRegionSize=16m -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled -XX:+UseStringDeduplication -XX:+AlwaysPreTouch -XX:InitiatingHeapOccupancyPercent=30 -XX:G1ReservePercent=20 -XX:G1NewSizePercent=20 -XX:G1MaxNewSizePercent=60 -XX:+UnlockDiagnosticVMOptions -XX:+G1SummarizeConcMark -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs -XX:ErrorFile=/app/logs/hs_err_pid%p.log -Xlog:gc*:file=/app/logs/gc.log:time,uptime,level,tags:filecount=5,filesize=10M"
    depends_on:
      - db
    mem_limit: 10g
    mem_reservation: 8g
    cpus: 2.0
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    sysctls:
      net.core.somaxconn: "65535"
      net.ipv4.tcp_fin_timeout: "15"
      net.ipv4.tcp_tw_reuse: "1"
    networks:
      - backend
  prometheus:
    image: prom/prometheus:v2.44.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - backend
  grafana:
    image: grafana/grafana:9.5.2
    container_name: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - backend
volumes:
  postgres-data:
networks:
  backend:
    driver: bridge
