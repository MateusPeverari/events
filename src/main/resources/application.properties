spring.application.name=events
springdoc.swagger-ui.url=/openapi.yml

server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.connection-timeout=5s
server.tomcat.accept-count=2000
server.tomcat.max-threads=400
server.tomcat.max-connections=10000
server.tomcat.keep-alive-timeout=20000
server.tomcat.max-keep-alive-requests=10000
server.tomcat.accesslog.enabled=false
server.tomcat.mbeanregistry.enabled=true
spring.mvc.async.request-timeout=30s

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/events_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:events_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:events_pass}
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.pool-name=HikariPool-Events
spring.datasource.hikari.maximum-pool-size=80
spring.datasource.hikari.minimum-idle=32
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1740000
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.register-mbeans=true
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

spring.task.execution.thread-name-prefix=async-exec-
spring.task.execution.pool.core-size=32
spring.task.execution.pool.max-size=128
spring.task.execution.pool.queue-capacity=10000
spring.task.execution.pool.keep-alive=60s

logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.level.org.zalando.logbook=OFF
logging.file.path=/app/logs
logging.logback.rollingpolicy.file-name-pattern=${logging.file.path}/events-%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.total-size-cap=5GB
logging.logback.rollingpolicy.max-history=7

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles=0.5,0.9,0.99

# Keep the datasource credentials override-friendly for docker-compose
